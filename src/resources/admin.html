<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Resources</title>
</head>

<body>

<header>
    <h1>Manage Resources</h1>
</header>

<main>

    
    <section id="resource-form-section">

        <form id="add-resource-form">

            <label>Title</label>
            <input type="text" id="resource-title" required>

            <label>Description</label>
            <input type="text" id="resource-description">

            <label>Link</label>
            <input type="text" id="resource-link" required>

            <button type="submit">Add Resource</button>

        </form>

    </section>


    <section id="resource-table-section">

        <table border="1">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Link</th>
                    <th>Actions</th>
                </tr>
            </thead>

            
            <tbody id="resources-table-body"></tbody>

        </table>

    </section>

</main>


<script src="resources.js" defer></script>

</body>
</html>
