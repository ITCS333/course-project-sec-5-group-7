<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin</title>
</head>
<body>

<form id="resource-form">

    <input id="resource-title" type="text" placeholder="Title" required>
    <input id="resource-description" type="text" placeholder="Description">
    <input id="resource-link" type="url" placeholder="Link" required>

    <button type="submit">Add</button>

</form>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Link</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="resources-table-body"></tbody>
</table>

<script src="admin.js"></script>

</body>
</html>
