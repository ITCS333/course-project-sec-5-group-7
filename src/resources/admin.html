<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Resources</title>
</head>
<body>

<h1>Manage Resources</h1>

<form id="resource-form">

    <input type="text" id="resource-title" placeholder="Title" required>

    <input type="text" id="resource-description" placeholder="Description">

    <input type="url" id="resource-link" placeholder="Link" required>

    <button type="submit">Save</button>

</form>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Link</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="resources-table-body"></tbody>
</table>

<script src="admin.js" defer></script>

</body>
</html>
