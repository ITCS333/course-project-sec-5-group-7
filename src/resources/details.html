<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resource Details</title>

    <link rel="stylesheet" href="styles.css">

    <script src="details.js" defer></script>
</head>
<body>

    <header>
        <h1 id="resource-title"></h1>
    </header>

    <main>

        <!-- Resource Information -->
        <article>
            <p id="resource-description"></p>

            <a id="resource-link" href="#" target="_blank">
                Access Resource Material
            </a>
        </article>

        <!-- Discussion Forum -->
        <section id="discussion-forum">

            <h2>Discussion</h2>

            <!-- Comments List -->
            <div id="comment-list">

                <!-- Example structure:
                <article>
                    <p>Comment text here</p>
                    <footer>Posted by: Ali Hassan</footer>
                </article>
                -->

            </div>

            <!-- Add Comment Form -->
            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>

                    <label for="new-comment">Comment:</label>
                    <textarea id="new-comment" required></textarea>

                    <button type="submit">Post Comment</button>

                </fieldset>
            </form>

        </section>

    </main>

</body>
</html>
