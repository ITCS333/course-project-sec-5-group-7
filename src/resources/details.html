<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>

    <script src="details.js" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        article {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #resource-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        #resource-link:hover {
            background-color: #2980b9;
        }

        #discussion-forum {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #comment-list {
            margin-bottom: 20px;
        }

        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-top: 5px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #219150;
        }
    </style>
</head>

<body>
    <header>
        <h1 id="resource-title">Resource Details</h1>
    </header>

    <main>
        <article>
            <p id="resource-description"></p>

            <a id="resource-link" href="#" target="_blank">
                Access Resource Material
            </a>
        </article>

        <section id="discussion-forum">
            <h2>Discussion</h2>

            <div id="comment-list">
                <!-- Comments will be added by details.js -->
            </div>

            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>

                    <label for="new-comment">Comment</label>
                    <textarea id="new-comment" required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
