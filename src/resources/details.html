<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
</head>

<body>

<header>
    <h1 id="resource-title"></h1>
</header>

<main>

    
    <section id="resource-details-section">

        <article id="resource-details">
            <p id="resource-description"></p>

            <a id="resource-link" href="#" target="_blank">
                Access Resource Material
            </a>
        </article>

    </section>

    <section id="discussion-forum">

        <h2>Discussion</h2>

        
        <ul id="comment-list"></ul>

        <form id="comment-form">
            <textarea id="new-comment" required></textarea>
            <button type="submit">Post Comment</button>
        </form>

    </section>

</main>

<script src="details.js" defer></script>

</body>
</html>
