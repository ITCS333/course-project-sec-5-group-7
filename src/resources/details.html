<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
</head>
<body>

<header>
    <h1 id="resource-title"></h1>
</header>

<main>

<article>
    <p id="resource-description"></p>
    <a id="resource-link" href="#" target="_blank">Access Resource Material</a>
</article>

<section id="discussion-forum">

    <h2>Discussion</h2>

    <!-- COMMENT LIST (important for tests) -->
    <ul id="comment-list"></ul>

    <form id="comment-form">
        <fieldset>
            <legend>Leave a Comment</legend>

            <!-- Author input (usually required by tests) -->
            <label for="comment-author">Name</label>
            <input type="text" id="comment-author" required>

            <label for="new-comment">Comment</label>
            <textarea id="new-comment" required></textarea>

            <button type="submit">Post Comment</button>
        </fieldset>
    </form>

</section>

</main>

<script src="details.js" defer></script>

</body>
</html>
