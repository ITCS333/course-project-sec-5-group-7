<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    
    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Discussion Board</title>

    <!-- Optional CSS framework (Bootstrap) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Optional custom stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="container py-4">

    <!-- Header -->
    <header class="mb-5">
        <h1>General Discussion Board</h1>
    </header>

    <!-- Main content -->
    <main>

        <!-- Section 1: Create a New Topic -->
        <section class="mb-5">
            <h2>Start a New Topic</h2>

            <form id="new-topic-form" action="#" class="border p-3 rounded">
                <fieldset>
                    <legend>New Topic Details</legend>

                    <div class="mb-3">
                        <label for="topic-subject" class="form-label">Subject:</label>
                        <input type="text" id="topic-subject" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="topic-message" class="form-label">Message:</label>
                        <textarea id="topic-message" class="form-control" rows="6" required></textarea>
                    </div>

                    <button id="create-topic" type="submit" class="btn btn-primary">Create Topic</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Topics -->
        <section>
            <h2>All Topics</h2>

            <div id="topics-list" class="list-group">

                <!-- Example Topic 1 -->
                <article class="list-group-item mb-3">
                    <h3><a href="topic-detail.html">Question about CSS Flexbox</a></h3>
                    <footer class="text-muted mb-2">
                        Posted by: Student Name on 2026-05-09
                    </footer>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-secondary">Edit</button>
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </div>
                </article>

                <!-- Example Topic 2 -->
                <article class="list-group-item mb-3">
                    <h3><a href="topic-detail.html">How to center a div?</a></h3>
                    <footer class="text-muted mb-2">
                        Posted by: Another Student on 2026-05-08
                    </footer>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-secondary">Edit</button>
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </div>
                </article>

                <!-- Example Topic 3 -->
                <article class="list-group-item mb-3">
                    <h3><a href="topic-detail.html">JavaScript fetch API question</a></h3>
                    <footer class="text-muted mb-2">
                        Posted by: Student X on 2026-05-07
                    </footer>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-secondary">Edit</button>
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </div>
                </article>

            </div>
        </section>

    </main>
</body>
</html>
