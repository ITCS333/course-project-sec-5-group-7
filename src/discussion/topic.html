<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topic Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="topic.js" defer></script>
    <style>
        #original-post {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            transition: box-shadow 0.2s ease;
        }
        #original-post:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #op-message {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        #op-footer {
            font-size: 0.875rem;
            color: #6c757d;
        }
        #reply-list-container article {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            transition: box-shadow 0.2s ease;
        }
        #reply-list-container article:hover {
            box-shadow: 0 3px 6px rgba(0,0,0,0.08);
        }
        #reply-list-container p {
            margin: 0 0 0.5rem 0;
        }
        #reply-list-container footer {
            font-size: 0.875rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        #reply-list-container button {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        #reply-form {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
        }
    </style>
</head>
<body class="container py-4">

    <header class="mb-4">
        <h1 id="topic-subject"></h1>
    </header>

    <main>

        <article id="original-post" class="border p-3 rounded mb-5">
            <p id="op-message"></p>
            <footer id="op-footer" class="text-muted mb-2"></footer>
            <div id="op-actions"></div>
        </article>

        <section id="replies-section" class="mb-5">
            <h2>Replies</h2>

            <div id="reply-list-container" class="list-group"></div>

            <form id="reply-form" action="#" class="border p-3 rounded mt-4">
                <fieldset>
                    <legend>Your Reply</legend>
                    <div class="mb-3">
                        <label for="new-reply" class="form-label">Message:</label>
                        <textarea id="new-reply" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Post Reply</button>
                </fieldset>
            </form>
        </section>

    </main>
</body>
</html>
