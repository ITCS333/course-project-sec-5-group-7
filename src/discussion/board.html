<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Board</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="board.js" defer></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #topic-list-container article {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: box-shadow 0.2s ease;
        }
        #topic-list-container article:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #topic-list-container h3 a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 600;
        }
        #topic-list-container h3 a:hover {
            text-decoration: underline;
        }
        #topic-list-container footer {
            font-size: 0.875rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        #topic-list-container div {
            display: flex;
            gap: 0.5rem;
        }
        #new-topic-form {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
        }
        #new-topic-form button {
            width: 100%;
        }
    </style>
</head>
<body class="container py-4">

    <header class="mb-5">
        <h1>General Discussion Board</h1>
    </header>

    <main>

        <section class="mb-5">
            <h2>Start a New Topic</h2>

            <form id="new-topic-form" action="#" class="border p-3 rounded">
                <fieldset>
                    <legend>New Topic Details</legend>

                    <div class="mb-3">
                        <label for="topic-subject" class="form-label">Subject:</label>
                        <input type="text" id="topic-subject" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="topic-message" class="form-label">Message:</label>
                        <textarea id="topic-message" class="form-control" rows="6" required></textarea>
                    </div>

                    <button id="create-topic" type="submit" class="btn btn-primary">Create Topic</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>All Topics</h2>
            <div id="topic-list-container" class="list-group"></div>
        </section>

    </main>
</body>
</html>
